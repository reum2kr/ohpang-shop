<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oh!Pang</title>
<meta name="description" content="Oh!Pang — 온라인 쇼핑몰 (OWASP 웹 취약점 분석 프로젝트 프론트엔드)">
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --ink:#1a1f27; --muted:#6b7684;
    --line:#ececf1; --brand:#2b6def; --brand-ink:#1b54c7; --accent:#ff4e50;
    --delivery:#1aa3ff; --star:#ffb400;
    --danger:#e5484d; --danger-bg:#fdecec; --safe:#2f9e44; --safe-bg:#ebfbee; --warn-bg:#fff3bf; --warn-ink:#b58a00;
    --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1318; --surface:#171c23; --ink:#e7ecf2; --muted:#9aa5b1;
      --line:#262d37; --brand:#4d8bff; --brand-ink:#79a7ff; --accent:#ff6b6b;
      --delivery:#4db8ff; --star:#ffc130;
      --danger:#ff6b6b; --danger-bg:#3a1e1f; --safe:#51cf66; --safe-bg:#17331f; --warn-bg:#3a3420; --warn-ink:#ffd43b;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  img{max-width:100%;display:block}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}

  /* ===== 최상단 띠 배너 ===== */
  .topad{background:var(--surface)}
  .topad-in{display:flex;height:78px}
  .ta{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 16px 0 22px;position:relative;overflow:hidden;cursor:pointer;color:#1a1f27}
  .ta-l{background:linear-gradient(90deg,#00a2ff 0%,#2cc2ff 55%,#0091ff 100%)}
  .ta-r{background:linear-gradient(90deg,#ff6a1a 0%,#ff9a3c 50%,#ff7f1f 100%)}
  .ta-l .ta-s,.ta-l .ta-txt b,.ta-r .ta-txt b{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.15)}
  .ta-l .ta-txt b em{color:#ffe14d}
  .ta .ta-chev{color:rgba(255,255,255,.7)}
  .ta:hover .ta-chev{color:#fff}
  .ta img{height:62px;width:auto;flex-shrink:0;align-self:flex-end;margin-bottom:6px;filter:drop-shadow(0 5px 6px rgba(0,0,0,.2));transition:transform .2s}
  .ta:hover img{transform:translateY(-2px)}
  .ta-txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;text-align:right;line-height:1.22;white-space:nowrap}
  .ta-s{font-size:16px;font-weight:700;color:#1f2630}
  .ta-txt b{font-size:21px;font-weight:900;letter-spacing:-.6px;color:#1b54c7}
  .ta-txt b em{font-style:normal;color:#e5333a}
  .ta-r .ta-txt b{font-size:24px;color:#2b1d10}
  .ta-chev{font-size:30px;font-weight:300;line-height:1;color:rgba(0,0,0,.32);margin-left:6px;transition:color .2s}
  .ta:hover .ta-chev{color:rgba(0,0,0,.6)}
  @media(max-width:700px){
    .ta-r{display:none}.topad-in{height:62px}.ta img{height:48px}
    .ta-s{font-size:12.5px}.ta-txt b{font-size:16px}
  }

  /* header */
  header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .topbar{display:flex;align-items:center;gap:16px;height:80px}
  .logo{display:flex;align-items:center}
  .logo img{height:58px;width:auto;display:block}
  .logo .lg-dark{display:none}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .logo .lg-light{display:none}
    :root:not([data-theme="light"]) .logo .lg-dark{display:block}
  }
  .search{flex:1;display:flex;max-width:640px}
  .search input{flex:1;border:2px solid var(--brand);border-right:none;border-radius:22px 0 0 22px;
    padding:11px 18px;font-size:14px;background:var(--surface);color:var(--ink);outline:none}
  .search button{border:none;background:var(--brand);color:#fff;padding:0 20px;border-radius:0 22px 22px 0;font-weight:700;font-size:15px}
  .navacts{display:flex;align-items:center;gap:4px;margin-left:auto}
  .navbtn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;color:var(--ink);
    padding:8px 11px;border-radius:10px;font-size:13.5px;font-weight:600;white-space:nowrap}
  .navbtn:hover{background:var(--bg)}
  .navbtn .badge{background:var(--accent);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:800}
  .whoami{font-size:12.5px;color:var(--muted);padding:0 4px}
  .whoami b{color:var(--brand-ink)}
  /* category rail */
  .catrail{display:flex;gap:4px;height:44px;align-items:center;overflow-x:auto;scrollbar-width:none}
  .catrail::-webkit-scrollbar{display:none}
  .catrail button{background:none;border:none;color:var(--ink);font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:8px;white-space:nowrap}
  .catrail button:hover{background:color-mix(in srgb,var(--cc) 10%,transparent);color:var(--cc)}
  .catrail button.on{color:var(--cc);font-weight:800;background:color-mix(in srgb,var(--cc) 13%,transparent)}
  .catrail .cdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:6px;vertical-align:1px}

  /* ===== 메인 배너 캐러셀 (직각) ===== */
  .banner-wrap{position:relative;margin:18px 0}
  .banner{position:relative;height:300px;margin:0;overflow:hidden;box-shadow:var(--shadow);background:#eef1f5}
  .slide{position:absolute;inset:0;display:flex;align-items:center;gap:20px;padding:0 190px 0 52px;
    opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s;cursor:pointer;color:#1a1f27;overflow:hidden}
  .slide.on{opacity:1;visibility:visible}
  .s-left{position:relative;flex:1;min-width:0;z-index:3}
  .s-tag{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--ink1,#1a1f27)}
  .s-tag .sep{opacity:.35;font-weight:400}
  .s-h{margin:0;font-size:40px;line-height:1.18;letter-spacing:-1.4px;font-weight:900;color:var(--ink1,#14181f)}
  .s-h em{font-style:normal;color:var(--sa,#2b6def)}
  .s-sub{margin:14px 0 0;font-size:18px;font-weight:700;color:var(--ink2,#2d3540)}
  .ink-w .s-tag,.ink-w .s-h,.ink-w .s-sub{text-shadow:0 2px 12px rgba(0,0,0,.18)}
  .ink-w .stamp{color:#fff;opacity:.75}
  .s-art{position:relative;flex:0 0 420px;height:100%;z-index:2}
  .s-em{position:absolute;line-height:1;filter:drop-shadow(0 16px 18px rgba(60,40,20,.22))}
  .s-prod{position:absolute;height:auto;max-width:none;filter:drop-shadow(0 18px 20px rgba(40,30,20,.25))}
  .podium{position:absolute;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 16px 30px rgba(40,30,20,.18);overflow:hidden}
  .podium img{width:80%;height:80%;object-fit:contain}
  .stamp{position:absolute;border:2px dashed currentColor;font-weight:900;font-size:12px;letter-spacing:1.5px;padding:12px 12px;border-radius:50%;opacity:.45;z-index:1}
  .swoosh{position:absolute;left:-16px;top:96px;width:340px;height:46px;pointer-events:none;z-index:-1}
  /* 배너 사이드 리스트 */
  .bn-list{position:absolute;right:26px;top:50%;transform:translateY(-50%);width:134px;background:#fff;border:1px solid #dfe3e8;
    box-shadow:0 4px 18px rgba(0,0,0,.14);z-index:6}
  .bn-list button{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;height:42px;padding:0 8px 0 10px;
    border:none;border-bottom:1px solid #eef0f3;background:#fff;text-align:left;font-size:10.5px;line-height:1.3;color:#222;font-weight:600}
  .bn-list button:last-child{border-bottom:none}
  .bn-list button .th{font-size:22px;flex-shrink:0;display:grid;place-items:center;width:30px;height:30px}
  .bn-list button .th img{width:30px;height:30px;object-fit:contain}
  .bn-list button:hover{background:#f7f9fc}
  .bn-list button.on{box-shadow:inset 0 0 0 2px var(--brand)}
  .bn-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:none;gap:6px;z-index:6}
  .bn-dots span{width:7px;height:7px;border-radius:4px;background:rgba(0,0,0,.25);cursor:pointer;transition:width .2s}
  .bn-dots span.on{background:#1a1f27;width:18px}
  /* 넓은 화면: 리스트를 배너 밖 오른쪽 여백으로 */
  @media(min-width:1420px){
    .bn-list{right:auto;left:calc(100% + 16px)}
    .slide{padding:0 64px 0 52px}
  }
  /* 가을 전단지 슬라이드 */
  .slide.autumn{background:
      radial-gradient(140px 95px at 14% 56%, rgba(255,140,30,.75), transparent 72%),
      radial-gradient(160px 100px at 33% 50%, rgba(255,80,30,.6), transparent 72%),
      radial-gradient(130px 85px at 60% 56%, rgba(255,120,20,.65), transparent 72%),
      radial-gradient(185px 115px at 80% 50%, rgba(255,170,40,.75), transparent 72%),
      linear-gradient(180deg,#38a8ff 0%,#7cc8ff 30%,#ffcf8f 64%,#ffab52 100%)}
  .slide.autumn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52px;
    background:repeating-linear-gradient(90deg,rgba(120,70,20,.12) 0 22px,transparent 22px 24px),linear-gradient(180deg,#cf945a,#a96a3b);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 -1px 3px rgba(0,0,0,.12)}
  .slide .ribbon{display:inline-block;background:linear-gradient(180deg,#ff5a5f,#e5333a);color:#fff;font-weight:800;
    padding:11px 20px;border-radius:9px;font-size:22px;letter-spacing:-.5px;box-shadow:0 5px 14px rgba(229,51,58,.38)}
  .slide .hero-date{margin:12px 0 12px;font-size:15px;font-weight:800;color:#5c2400}
  .slide .pill{display:inline-block;background:#fff;color:var(--accent);padding:7px 14px;border-radius:30px;font-size:13px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.1)}
  .hero-show{display:flex;gap:12px;flex-shrink:0;z-index:2;align-self:flex-end;margin-bottom:36px}
  .hero-tile{width:122px;background:#fff;border-radius:12px;padding:14px 10px;color:#1a1f27;
    box-shadow:0 14px 26px rgba(120,70,20,.26);text-align:center;position:relative;transition:transform .12s}
  .hero-tile:hover{transform:translateY(-4px)}
  .hero-tile .hdisc{position:absolute;top:8px;left:8px;background:#ff4e50;color:#fff;font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px}
  .hero-tile .hbolt{position:absolute;top:8px;right:8px;font-size:12px}
  .hero-tile .hemoji{font-size:54px;line-height:1.15;margin-top:6px}
  .hero-tile .himg{width:84px;height:84px;object-fit:contain;margin:6px auto 0}
  .hero-tile .hnm{font-size:11.5px;font-weight:600;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1a1f27}
  .hero-tile .hpr{font-size:13.5px;font-weight:800;color:#ff4e50}
  .slide .leaf{position:absolute;z-index:1;opacity:.9;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08));pointer-events:none}
  .slide .leaf.l1{top:12px;left:40%;font-size:22px;transform:rotate(-20deg)}
  .slide .leaf.l2{top:26px;right:22%;font-size:18px;transform:rotate(25deg)}
  .slide .leaf.l3{top:58px;left:54%;font-size:15px;transform:rotate(-12deg)}
  .slide .leaf.l4{top:20px;left:24%;font-size:14px;transform:rotate(18deg)}
  @media(max-width:860px){
    .bn-list{display:none}.bn-dots{display:flex}
    .slide{padding:0 24px}.s-art,.hero-show,.stamp{display:none}
    .s-h{font-size:28px}.s-sub{font-size:15px}.swoosh{width:240px;top:64px}
  }

  /* ===== 오른쪽 사이드 광고 (넓은 화면 전용) ===== */
  .home-main{position:relative}
  .side-ads{position:absolute;left:calc(100% + 16px);top:0;bottom:0;width:134px;display:none}
  @media(min-width:1420px){.side-ads{display:block}}
  .side-ads-in{position:sticky;top:140px}
  .ad-page{display:flex;flex-direction:column;gap:10px;animation:adIn .35s ease}
  @keyframes adIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ad-card{position:relative;display:block;height:158px;border-radius:6px;padding:11px 11px 0;overflow:hidden;cursor:pointer;
    color:#1a1f27;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
  .ad-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.14)}
  .ad-card.dark{color:#fff}
  .ad-t{font-size:13px;font-weight:800;line-height:1.28;letter-spacing:-.4px}
  .ad-t em{font-style:normal;color:var(--em,#2b6def)}
  .ad-t.big{font-size:17px;line-height:1.15}
  .ad-go{display:grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#2b6def;color:#fff;font-size:12px;font-weight:900;margin-top:6px;line-height:1}
  .ad-card.dark .ad-go{background:#fff;color:#2b6def}
  .ad-img{position:absolute;right:8px;bottom:7px;max-width:100px;max-height:84px;width:auto;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
  .ad-pager{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;color:var(--muted);margin-top:10px}
  .ad-pager b{color:var(--ink)}
  .ad-pager button{display:grid;place-items:center;width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--ink);font-size:13px;line-height:1}

  /* sections + grid */
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 14px}
  .sec-h h2{font-size:19px;margin:0;letter-spacing:-.4px}
  .sec-h h2::before{content:"";display:inline-block;width:6px;height:19px;border-radius:3px;background:linear-gradient(180deg,#ff3b5c,#ffb703);margin-right:9px;vertical-align:-3px}
  .sec-h span{font-size:12.5px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  @media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.topbar{flex-wrap:wrap;height:auto;padding:10px 0}.search{order:3;max-width:100%;flex-basis:100%}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .12s,box-shadow .12s;cursor:pointer}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(20,30,45,.12);border-color:#dfe3ea}
  .card .thumb{position:relative;aspect-ratio:1/1;display:grid;place-items:center;font-size:56px;background:#fff;overflow:hidden;border-bottom:1px solid var(--line)}
  .card .thumb img{height:100%;width:100%;object-fit:contain;transition:transform .25s}
  .card:hover .thumb img{transform:scale(1.04)}
  .card .dbadge{position:absolute;left:8px;top:8px;background:var(--delivery);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px}
  .card .soldout{position:absolute;inset:0;background:rgba(20,25,33,.55);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
  .card .body{padding:11px 12px 14px}
  .card .nm{font-weight:600;font-size:13.5px;line-height:1.4;margin:0 0 8px;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .price-row{display:flex;align-items:baseline;gap:6px}
  .card .disc{color:var(--accent);font-weight:800;font-size:16px}
  .card .pr{font-weight:800;font-size:16px}
  .card .op{font-size:12px;color:var(--muted);text-decoration:line-through;margin-top:2px}
  .card .stars{margin-top:7px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:3px}
  .card .stars .s{color:var(--star);letter-spacing:-1px}
  .card .stk{margin-top:6px;font-size:11.5px;color:var(--muted)}
  .card .deliv{margin-top:3px;font-size:11.5px;color:var(--delivery);font-weight:700}

  /* panels/forms/buttons */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel h2{margin:0 0 4px;font-size:20px;letter-spacing:-.4px}
  .panel .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .row{display:flex;gap:18px;flex-wrap:wrap}
  .col{flex:1;min-width:280px}
  label.fld{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 5px}
  input.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;background:var(--bg);color:var(--ink);outline:none;font-family:inherit}
  input.inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-ink)}
  .btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  .btn.accent{background:var(--accent);color:#fff}
  .btn.block{width:100%}
  .btn.sm{padding:7px 12px;font-size:12.5px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  table.tbl th,table.tbl td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.tbl th{color:var(--muted);font-size:12px;font-weight:700}
  .status{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
  .status.pending{background:var(--warn-bg);color:var(--warn-ink)}
  .status.paid{background:var(--safe-bg);color:var(--safe)}
  .status.failed{background:var(--danger-bg);color:var(--danger)}
  .notice{padding:11px 14px;border-radius:10px;font-size:13px;margin:10px 0}
  .notice.err{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger)}
  .notice.ok{background:var(--safe-bg);color:var(--safe);border:1px solid var(--safe)}
  .notice.info{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
  .crumbs{font-size:12.5px;color:var(--muted);margin:16px 0 6px}
  .crumbs a{color:var(--brand-ink);font-weight:600;cursor:pointer}

  /* cart */
  .cart-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .cart-item .ic{width:64px;height:64px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:30px;overflow:hidden;flex-shrink:0}
  .cart-item .ic img{width:100%;height:100%;object-fit:contain}
  .pd-img{height:300px;background:#fff;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;font-size:130px;overflow:hidden}
  .pd-img img{width:100%;height:100%;object-fit:contain}
  .mini{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:7px;background:#fff;border:1px solid var(--line);vertical-align:middle;margin-right:10px;overflow:hidden;font-size:22px}
  .mini img{width:100%;height:100%;object-fit:contain}
  .cart-item .meta{flex:1;min-width:0}
  .cart-item .meta .n{font-weight:700;font-size:14px}
  .cart-item .meta .p{color:var(--muted);font-size:12.5px}
  .qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .qty button{width:32px;height:32px;border:none;background:var(--surface);font-size:16px;font-weight:700;color:var(--ink)}
  .qty button:hover{background:var(--bg)}
  .qty span{min-width:38px;text-align:center;font-weight:700;font-size:14px}
  .sumline{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
  .sumline.total{font-weight:800;font-size:18px;border-top:2px solid var(--line);margin-top:8px;padding-top:12px}
  .big-result{text-align:center;padding:28px 0}
  .big-result .ico{font-size:64px}

    background-attachment:fixed;

/* ===================== CONFIG (백엔드 연동 지점) =====================
   API 모드는 실행 위치에 따라 자동 선택:
     · http://localhost 또는 http://127.0.0.1 로 연 경우 → 실제 백엔드 API
     · 그 외(GitHub Pages, 파일 더블클릭 등)          → 목(mock) 데이터
   주소 뒤에 ?api=real 또는 ?api=mock 을 붙이면 강제로 선택할 수 있음.
     예) http://127.0.0.1:5500/index.html?api=mock   https://reum2kr.github.io/ohpang-shop/?api=real */
const API_MODE = (() => {
  const q = new URLSearchParams(location.search).get('api');
  if (q === 'real' || q === 'mock') return q;
  return ['localhost', '127.0.0.1'].includes(location.hostname) ? 'real' : 'mock';
})();
const CONFIG = {
  API_BASE: 'http://127.0.0.1:3000/api/v1',   // 백엔드 기본 주소 (다른 PC면 여기만 바꾸면 됨)
  USE_MOCK: API_MODE !== 'real',
};

const won = n => '₩' + Number(n||0).toLocaleString('ko-KR');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k,d){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} },

  del(k){ try{localStorage.removeItem(k);}catch(e){} },
};

/* ===================== REST 호출 헬퍼 (실제 API 모드) ===================== */
// 응답 전체(JSON)를 반환. 서버 연결 실패·오류 응답은 Error로 던짐 (status 포함)
async function httpJson(method, path, body){
  let res;
  try{
    res = await fetch(CONFIG.API_BASE + path, {
      method,
      credentials: 'include',                       // 서버 세션 쿠키 사용
      headers: body ? { 'Content-Type':'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
  }catch(e){
    const err = new Error(`백엔드 서버에 연결할 수 없습니다 (${CONFIG.API_BASE}). 서버가 실행 중인지 확인해 주세요. 목 데이터로 보려면 주소 뒤에 ?api=mock 을 붙이세요.`);
    err.network = true; throw err;
  }
  let json; try{ json = await res.json(); }catch(e){ json = {success:false, message:'서버 응답을 해석할 수 없습니다.'}; }
  if(!res.ok || json.success === false){ const err = new Error(json.message || ('요청 실패 ('+res.status+')')); err.status = res.status; throw err; }
  return json;
}
// 응답의 data 필드만 반환
async function http(method, path, body){ return (await httpJson(method, path, body)).data; }

/* ===================== 목(MOCK) 데이터 계층 =====================

/* ===================== API (프론트 공용 인터페이스) =====================
   각 메서드는 성공 시 데이터를 반환, 실패 시 Error를 throw.
   실제 API 모드의 요청·응답 형식은 백엔드 연동본(ohpang-frontend-integration)에서 확인된 것을 따름:
     · 인증(register/login/me): 응답의 user 필드 / 로그아웃: success만 확인
     · 상품·주문 조회: data 필드

   상품 번호: DB 상품 id(6~25) ↔ 화면 상품 번호(101~120).

const DB_ID_OFFSET = 95;
const toDbId = id => { const n = Number(id); return n >= 101 ? n - DB_ID_OFFSET : n; };
function mapDbProduct(p){
  const dbId = Number(p.id), id = dbId + DB_ID_OFFSET;
  return { ...p, dbId, id, icon: p.emoji || p.icon || '📦', imageUrl: p.imageUrl || `images/p${id}.jpg` };
}
const pick = (j, ...keys) => { for(const k of keys){ if(j && j[k] !== undefined) return j[k]; } return j; };

  async register({email,password,name}){
    if(!CONFIG.USE_MOCK) return pick(await httpJson('POST','/auth/register',{email,password,name}), 'user','data');

    if(!email||!password||!name) throw new Error('이메일·비밀번호·이름을 모두 입력해 주세요.');
    if(users.some(u=>u.email===email)) throw new Error('이미 가입된 이메일입니다.');
    const user = {id:Date.now(), email, password, name};
    users.push(user); MOCK.saveUsers(users);
    return {id:user.id, email, name};
  },
  async login({email,password}){
    if(!CONFIG.USE_MOCK){
      const j = await httpJson('POST','/auth/login',{email,password});
      return {token:'session', user: pick(j,'user','data')};          // 인증은 서버 세션 쿠키
    }

    return {token, user:{id:user.id, email:user.email, name:user.name}};

  async logout(){
    if(!CONFIG.USE_MOCK){ await httpJson('POST','/auth/logout'); return {ok:true}; }
    return {ok:true};

  async me(){
    if(!CONFIG.USE_MOCK) return pick(await httpJson('GET','/auth/me'), 'user','data');
    const s = session.get(); if(!s) throw new Error('로그인이 필요합니다.');
    return s.user;
  },
  async products({search='', category=''}={}){
    if(!CONFIG.USE_MOCK){
      const qs = new URLSearchParams(); if(search)qs.set('search',search); if(category&&category!=='전체')qs.set('category',category);
      const list = await http('GET','/products'+(qs.toString()?('?'+qs):''));

    let list = MOCK_PRODUCTS.slice();
    if(category && category!=='전체') list = list.filter(p=>p.category===category);
    if(search){ const k=search.toLowerCase(); list = list.filter(p=>p.name.toLowerCase().includes(k)||(p.description||'').toLowerCase().includes(k)); }
    return list;
  },
  async product(id){
    if(!CONFIG.USE_MOCK) return mapDbProduct(await http('GET','/products/'+encodeURIComponent(toDbId(id))));
    const p = MOCK_PRODUCTS.find(x=>x.id===Number(id));
    if(!p) throw new Error('상품을 찾을 수 없습니다.');
    return p;
  },
  async createOrder({items, shippingAddress}){
    if(!CONFIG.USE_MOCK){
      const body = { items: items.map(i=>({productId: toDbId(i.productId), quantity: i.quantity})), shippingAddress };
      return pick(await httpJson('POST','/orders',body), 'data');     // { orderId, totalAmount, status }
    }
    const s = session.get(); if(!s) throw new Error('로그인이 필요합니다.');
    if(!items||!items.length) throw new Error('주문할 상품이 없습니다.');
    // 서버가 상품/가격을 다시 검증 (프론트가 보낸 가격은 신뢰하지 않음)
    let total=0; const detail=[];
    for(const it of items){
      const p = MOCK_PRODUCTS.find(x=>x.id===Number(it.productId));
      if(!p) throw new Error('존재하지 않는 상품이 포함되어 있습니다.');
      if(p.stock < it.quantity) throw new Error(`"${p.name}" 재고가 부족합니다. (재고 ${p.stock}개)`);
      total += p.price * it.quantity;
      detail.push({productId:p.id, name:p.name, price:p.price, quantity:it.quantity, icon:p.icon, imageUrl:p.imageUrl});
    }
    const order = {
      orderId: MOCK.nextOrderId(), userId: s.user.id, items: detail,
      totalAmount: total, status:'PENDING', shippingAddress: shippingAddress||'(미입력)',
      createdAt: new Date().toISOString(),
    };
    const orders = MOCK.orders(); orders.push(order); MOCK.saveOrders(orders);
    return {orderId: order.orderId, totalAmount: order.totalAmount, status: order.status};
  },
  async myOrders(){
    if(!CONFIG.USE_MOCK){ const hidden=hiddenOrders.get(); return (await http('GET','/orders')||[]).filter(o=>!hidden.includes(Number(o.orderId))); }
    const s = session.get(); if(!s) throw new Error('로그인이 필요합니다.');
    return MOCK.orders().filter(o=>o.userId===s.user.id).sort((a,b)=>b.orderId-a.orderId);
  },
  async order(id){
    if(!CONFIG.USE_MOCK) return http('GET','/orders/'+encodeURIComponent(id));
    const o = MOCK.orders().find(x=>x.orderId===Number(id));
    if(!o) throw new Error('주문을 찾을 수 없습니다.');
    return o;
  },
  async updateAddress(id, shippingAddress){
    if(!CONFIG.USE_MOCK) return pick(await httpJson('PATCH','/orders/'+encodeURIComponent(id)+'/address',{shippingAddress}), 'data');
    const orders = MOCK.orders(); const o = orders.find(x=>x.orderId===Number(id));
    if(!o) throw new Error('주문을 찾을 수 없습니다.');
    o.shippingAddress = shippingAddress; MOCK.saveOrders(orders);
    return {orderId:o.orderId, shippingAddress:o.shippingAddress};
  },
  async pay(id, {amount, paymentMethod}){
    if(!CONFIG.USE_MOCK) return pick(await httpJson('POST','/orders/'+encodeURIComponent(id)+'/pay',{amount:Number(amount), paymentMethod}), 'data');
    const orders = MOCK.orders(); const o = orders.find(x=>x.orderId===Number(id));
    if(!o) throw new Error('주문을 찾을 수 없습니다.');
    if(o.status==='PAID') throw new Error('이미 결제가 완료된 주문입니다.');
    // 모의 결제: 상태를 PAID로. (실제 결제 연동 없음)
    o.status='PAID'; o.paidAt=new Date().toISOString(); o.paymentMethod=paymentMethod;
    MOCK.saveOrders(orders);
    return {orderId:o.orderId, amount:o.totalAmount, status:'PAID'};
  },
  /* 주문 내역 삭제
     · 목 모드: 실제로 삭제
     · 실제 API: DELETE /orders/:id 호출. 백엔드에 아직 삭제 API가 없으면(404·405)
       이 기기의 주문 목록에서만 숨김 → { hiddenOnly:true } */
  async deleteOrder(id){
    if(!CONFIG.USE_MOCK){
      try{ await httpJson('DELETE','/orders/'+encodeURIComponent(id)); return {deleted:true}; }
      catch(e){
        if(e.status===404 || e.status===405 || e.status===501){ hiddenOrders.add(id); return {hiddenOnly:true}; }
        throw e;
      }
    }
    const s = session.get(); if(!s) throw new Error('로그인이 필요합니다.');
    const orders = MOCK.orders(); const i = orders.findIndex(x=>x.orderId===Number(id) && x.userId===s.user.id);
    if(i<0) throw new Error('주문을 찾을 수 없습니다.');
    orders.splice(i,1); MOCK.saveOrders(orders);
    return {deleted:true};
  },
  async payment(id){
    if(!CONFIG.USE_MOCK) return http('GET','/orders/'+encodeURIComponent(id)+'/payment');
    const o = MOCK.orders().find(x=>x.orderId===Number(id));
    if(!o) throw new Error('결제 내역을 찾을 수 없습니다.');
    return {orderId:o.orderId, amount:o.totalAmount, status:o.status, paymentMethod:o.paymentMethod||null};
  },
};

  setQty(productId, q){ const c=this.get(); const e=c.find(i=>Number(i.productId)===Number(productId)); if(e){ e.quantity=Math.max(1,q); } this.set(c); },
  remove(productId){ this.set(this.get().filter(i=>Number(i.productId)!==Number(productId))); },
  clear(){ this.set([]); },
  count(){ return this.get().reduce((s,i)=>s+i.quantity,0); },
};

/* 카드 표시용 파생값 (할인율·별점·배송 — 화면 연출용) */
function meta(p){
  if(!CONFIG.USE_MOCK && (p.discountPercent!==undefined || p.rating!==undefined)){
    return { pct:Number(p.discountPercent||0), oprice:Number(p.originalPrice||0), rating:Number(p.rating||0).toFixed(1),
             reviews:Number(p.reviewCount||0), rocket:Boolean(p.isFastDelivery) };
  }
  const dt=[18,25,0,15,30,12,22,10,20,33,15,27,19,24,0,14,28,0,31,16];
  const pct=dt[(p.id-101+dt.length)%dt.length]||0;
  const oprice=pct>0?Math.round(p.price/(1-pct/100)/100)*100:0;
  const rating=Math.min(5,(4.3+(((p.id*7)%7)/10))).toFixed(1);
  const reviews=((p.id*137)%1800)+42;
  const rocket=(p.id%4)!==0;
  return {pct,oprice,rating,reviews,rocket};
}
function productImg(p){
  return p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy" decoding="async">` : (p.icon||'📦');
}

    <a class="ad-card${a.dark?' dark':''}" style="background:${a.bg};--em:${a.em}" onclick="go('${a.link}')">
      <div class="ad-t${a.big?' big':''}">${a.t}</div><span class="ad-go">›</span>
      <img class="ad-img" src="images/cut/${a.img}.webp" alt="">
    </a>`).join('');
}
function sideAdsHTML(){
  const n=Math.ceil(ADS.length/AD_PER);
  return `<aside class="side-ads" aria-label="광고" onmouseenter="adHover=true" onmouseleave="adHover=false">
    <div class="side-ads-in">
      <div class="ad-page" id="adPage">${adCards()}</div>
      <div class="ad-pager"><button onclick="adGo(-1)" aria-label="이전 광고">‹</button><span><b id="adNo">${adPage+1}</b>/${n}</span><button onclick="adGo(1)" aria-label="다음 광고">›</button></div>
    </div></aside>`;
}
function adGo(d){
  const n=Math.ceil(ADS.length/AD_PER); adPage=(adPage+d+n)%n;
  const el=document.getElementById('adPage'); if(!el) return;
  el.outerHTML=`<div class="ad-page" id="adPage">${adCards()}</div>`;
  document.getElementById('adNo').textContent=adPage+1;
  adStart();
}
function adStart(){
  clearInterval(adTimer);
  adTimer=setInterval(()=>{
    if(!document.getElementById('adPage')){ clearInterval(adTimer); return; }
    if(!adHover) adGo(1);
  }, 7000);
}

const SMILE_SVG = `<svg class="SVGCLS" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4a20 20 0 1 0 11.6 36.3L43 44l-2.4-8.3A20 20 0 0 0 24 4z" fill="#e9f59b" stroke="#1f1640" stroke-width="2.6" stroke-linejoin="round"/><circle cx="17.5" cy="20" r="2.4" fill="#1f1640"/><circle cx="30.5" cy="20" r="2.4" fill="#1f1640"/><path d="M15 28q9 8 18 0" fill="none" stroke="#1f1640" stroke-width="2.6" stroke-linecap="round"/></svg>`;
function polaHTML(b,i){
  const p=b.pola||{};
  const inner = p.text ? `<span class="card-txt">${p.text}</span>`
    : p.cut ? `<img class="ph cut" src="images/cut/${p.cut}.webp" alt="" style="--pbg:${p.bg||'#eee'};background:${p.bg||'#eee'}">`
    : `<img class="ph" src="${p.img}" alt="">`;
  return `<a class="pola" onmouseenter="bnGo(${i})" onclick="go('${b.link}')" aria-label="${esc((p.cap||'').replace(/<br>/g,' ')||b.key)}">
    <span class="tape" style="--tape:${p.tape||'#cfc6ff'}"></span>${inner}${p.cap?`<span class="cap">${p.cap}</span>`:''}</a>`;
}

const CUT_IDS = new Set([101,102,103,104,105,106,107,108,109,110,111,112,113,114,115,117,118,119,120]);
const CARD_BG = ['#cdbdf7','#a8e6d8','#ffd3b4','#c9b8f3','#bfe2ff','#ffd0e4'];
const CARD_PK = ['#a58cf2','#5cc8b0','#ff9e66','#9d86ec','#6cbcf5','#f58ab8'];
function cardHTML(p){
  const m=meta(p);
  const stars='★'.repeat(Math.round(m.rating))+'☆'.repeat(5-Math.round(m.rating));
  const sold=p.stock===0, k=p.id%6;
  const img = CUT_IDS.has(p.id)
    ? `<img class="cut" src="images/cut/c${p.id}.webp" alt="${esc(p.name)}" loading="lazy" decoding="async">`
    : (p.imageUrl ? `<img class="ph" src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy" decoding="async">` : (p.icon||'📦'));
  const s = p.id%5;
  const stk = s===0 ? SMILE_SVG.replace('class="SVGCLS"','class="stkr smile"')
            : s===1 ? '<span class="stkr hot">HOT!</span>'
            : s===3 ? '<span class="stkr get">GET IT!</span>' : '';
  return `<div class="card" onclick="go('/product/${p.id}')">
    <span class="pick" style="--pk:${CARD_PK[k]}">Oh!PICK</span>${stk}
    <div class="thumb" style="--tb:${CARD_BG[k]}">${img}${sold?'<div class="soldout">품절</div>':''}</div>
    <div class="body">
      <div class="nm">${esc(p.name)}</div>
      <div class="price-row">${m.pct>0?`<span class="disc">${m.pct}%</span>`:''}<span class="pr">${won(p.price)}</span></div>
      ${m.oprice?`<div class="op">${won(m.oprice)}</div>`:''}
      <div class="stars"><span class="s">${stars}</span> ${m.rating} <span style="color:var(--muted)">(${m.reviews.toLocaleString('ko-KR')})</span></div>
      <div class="stk">재고 ${p.stock.toLocaleString('ko-KR')}개</div>
      <div class="deliv">${m.rocket?'번개배송 · 내일 도착':'모레 도착'}</div>
    </div></div>`;
}

async function viewCart(v){
  const items=cart.get();

  const lines=items.map(it=>{const p=prods.find(x=>x.id===it.productId); return p?{...p,quantity:it.quantity}:null;}).filter(Boolean);
  const total=lines.reduce((s,l)=>s+l.price*l.quantity,0);
  v.innerHTML=`<div class="panel"><h2>장바구니</h2>
    ${lines.map(l=>`<div class="cart-item">
      <div class="ic">${productImg(l)}</div>
      <div class="meta"><div class="n">${esc(l.name)}</div><div class="p">${won(l.price)} · 재고 ${l.stock}개</div></div>
      <div class="qty"><button onclick="cartQty(${l.id},${l.quantity-1})">−</button><span>${l.quantity}</span><button onclick="cartQty(${l.id},${l.quantity+1})">+</button></div>
      <div style="font-weight:800;min-width:90px;text-align:right">${won(l.price*l.quantity)}</div>
      <button class="btn ghost sm" onclick="cartRemove(${l.id})">삭제</button>
    </div>`).join('')}
    <div class="sumline"><span>상품금액</span><span>${won(total)}</span></div>
    <div class="sumline"><span>배송비</span><span>무료</span></div>
    <div class="sumline total"><span>결제 예정 금액</span><span>${won(total)}</span></div>
    <button class="btn primary block" style="margin-top:16px" onclick="go('/checkout')">주문하기</button>
  </div>`;
}
function cartQty(id,q){ if(q<1){ cartRemove(id); return; } cart.setQty(id,q); render(); }
function cartRemove(id){ cart.remove(id); render(); }

async function doCreateOrder(){
  const addr=document.getElementById('coAddr').value.trim();
  const name=document.getElementById('coName').value.trim();
  const msg=document.getElementById('coMsg');
  const btn=document.getElementById('coBtn');
  if(!addr){ msg.innerHTML='<div class="notice err">배송지를 입력해 주세요.</div>'; return; }
  btn.disabled=true;
  try{
    const items=cart.get().map(i=>({productId:i.productId, quantity:i.quantity})); // 가격은 서버가 계산
    const r=await api.createOrder({items, shippingAddress:`${name} / ${addr}`});
    cart.clear();
    go('/pay/'+r.orderId);
  }catch(e){ msg.innerHTML=`<div class="notice err">${esc(e.message)}</div>`; btn.disabled=false; }
}

/* ===================== 확인 창 ===================== */
function confirmBox(title, message, okLabel='확인'){
  return new Promise(resolve=>{
    const m=document.createElement('div'); m.className='modal-mask';
    m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3><p>${message}</p>
      <div class="btn-row"><button class="btn ghost sm" data-r="0">취소</button><button class="btn danger-fill sm" data-r="1">${esc(okLabel)}</button></div></div>`;
    const done=v=>{ m.remove(); document.removeEventListener('keydown',onKey); resolve(v); };
    const onKey=e=>{ if(e.key==='Escape') done(false); };
    m.addEventListener('click',e=>{ if(e.target===m) done(false); const r=e.target.closest('[data-r]'); if(r) done(r.dataset.r==='1'); });
    document.addEventListener('keydown',onKey);
    document.body.appendChild(m); m.querySelector('[data-r="1"]').focus();
  });
}

];

function trkTime(t){
  const d=new Date(t), now=new Date();
  const day=new Date(d.getFullYear(),d.getMonth(),d.getDate()), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((today-day)/864e5);
  const hm=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
  const dl=diff===0?'오늘':diff===1?'어제':diff===-1?'내일':`${d.getMonth()+1}/${d.getDate()}`;
  return `${dl} ${hm}`;
}
function buildTracking(o, paidAt){
  const id=Number(o.orderId);
  const created=new Date(o.createdAt||Date.now()).getTime();
  const tr=o.tracking;
  if(tr && Array.isArray(tr.events)){
    return { step:Number(tr.step||0), events:tr.events.map(e=>({t:new Date(e.time).getTime(), title:e.title, en:e.en||'', place:e.place||''})),
      invoiceNo:tr.invoiceNo||'-', eta:tr.eta?new Date(tr.eta).getTime():null,
      courier:tr.courier||null, pending:false };
  }
  const invoiceNo='OP'+new Date(created).toISOString().slice(2,10).replace(/-/g,'')+String(id).padStart(6,'0');
  const events=[{t:created, title:'주문 접수', en:'Order Received', place:'Oh!Pang'}];
  if(o.status!=='PAID') return {step:-1, events, invoiceNo, eta:null, courier:null, pending:true};
  const t0=new Date(paidAt||o.paidAt||o.updatedAt||o.createdAt||Date.now()).getTime();
  const addr=String(o.shippingAddress||'').replace(/^[^/]*\/\s*/,'').trim().split(/\s+/);
  const region=(addr.length>=2 && /[시도]$/.test(addr[0])) ? addr[0].replace(/(특별|광역)?시$|도$/,'')+' '+addr[1] : '우리 동네';
  const now=Date.now(); let step=0;
  for(const [m,s,title,en,place] of TRK_PLAN){
    const t=t0+m*60000; if(t>now) break;
    events.push({t, title, en, place:place.replace('{region}',region)}); step=s;
  }
  events.sort((a,b)=>b.t-a.t);
  const name=COURIERS[id%COURIERS.length];
  const msg=['상품을 정성껏 포장하고 있어요! 📦','곧 출발합니다! 조금만 기다려 주세요 🚚','소중하게 배달하겠습니다! 😄','문 앞에 놓고 갔어요. 즐거운 하루 되세요! 💐'][step];
  return { step, events, invoiceNo, eta:t0+240*60000,
    courier: step>=1 ? {name:name+' 기사님', phone:'050-7'+String(id*37%1000).padStart(3,'0')+'-'+String(1000+id*733%9000).slice(-4)+' (안심번호)', message:msg}
                     : {name:'배정 중', phone:'출고되면 알려드려요', message:msg},
    pending:false };
}

async function viewTracking(v, id){
  if(!session.get()){ go('/login'); return; }
  if(!id){
    const orders=await api.myOrders();
    const paid=orders.find(o=>o.status==='PAID');

    v.innerHTML=`<div class="panel"><div class="empty"><div class="ico">🚚</div><p>배송 중인 주문이 없어요.</p>

    return;
  }
  const o=await api.order(id);
  let paidAt=null;
  if(o.status==='PAID' && !o.paidAt){ try{ const p=await api.payment(id); paidAt=p.paidAt||p.createdAt||null; }catch(e){} }
  const tr=buildTracking(o, paidAt);
  const step=tr.step;
  const title = tr.pending ? `<span class="p">결제가 끝나면</span> <span class="eyes"><i></i><i></i></span><br><span class="m">바로 출발할게요!</span>`
    : step===3 ? `<span class="m">소중한 선물이</span> <span class="eyes"><i></i><i></i></span><br><span class="eyes s"><i></i><i></i></span><span class="p">도착했어요!</span>`
    : `<span class="m">배송 중인</span> <span class="p">소중한 선물,</span><span class="eyes"><i></i><i></i></span><br><span class="eyes s"><i></i><i></i></span><span class="p">어디쯤 있을까요?</span>`;
  const steps=TRK_STEPS.map((s,i)=>{
    const cls = tr.pending ? 'todo' : i<step ? 'done' : i===step ? 'now' : 'todo';
    const ico = s.icon==='burst' ? `<span class="burst">${TRK_ICON.burst}${step===3?'<span class="yes">YES!</span>':''}</span>` : TRK_ICON[s.icon];
    return `<li class="${cls}" style="--sc:${s.sc}"><div class="in">${cls==='now'?'<span class="trk-now">지금 여기!</span>':''}<b>${s.label}</b>${ico}</div></li>`;
  }).join('');
  const items=(o.items||[]);
  const polas=[['courier','오늘 출발!','#f6c26b'],['box','꼼꼼 포장','#c9b8ff'],['couple','선물 도착','#e9f59b'],['unbox','언박싱 타임','#ffb3cf']]
    .map(([k,cap,tape])=>`<div class="pola"><span class="tape" style="--tape:${tape}"></span><img class="ph" src="images/trk/${k}.jpg" alt=""><span class="cap">${cap}</span></div>`).join('');
  v.innerHTML=`<div class="crumbs"><a onclick="go('/mypage')">마이페이지</a> › <a onclick="go('/order/${o.orderId}')">주문 상세</a> › 배송 조회</div>
  <div class="home-wrap trk">
    <section class="trk-hero" aria-label="배송 진행 단계">
      <div class="trk-arch"></div>
      <span class="spk v" style="left:30%;top:42px;font-size:30px">✦</span><span class="spk y" style="left:33.5%;top:30px;font-size:16px">✦</span>
      <span class="spk y" style="left:9%;top:92px;font-size:24px">✦</span><span class="spk y" style="left:11%;top:118px;font-size:38px">✦</span><span class="spk v" style="left:7.5%;top:142px;font-size:26px">✦</span>
      <span class="spk" style="right:31%;top:96px;font-size:20px">✦</span><span class="spk" style="right:6%;top:62px;font-size:22px">✧</span><span class="spk" style="right:4.5%;bottom:110px;font-size:20px">✦</span>
      <h2 class="trk-title">${title}</h2>
      <ol class="trk-steps">${steps}</ol>
      ${TRK_STK.courier}${TRK_STK.heart}${TRK_STK.dog}${TRK_STK.box}${SMILE_SVG.replace('SVGCLS','stk st-smile')}
    </section>
    <div class="trk-grid">
      <div class="trk-log">
        <span class="tape2" style="--tape:#cdb8ff"></span>${TRK_STK.hearts}
        <div class="trk-meta"><span>주문번호 <b>#${o.orderId}</b></span><span>택배사 <b>오팡 번개배송</b></span><span>운송장 <b>${esc(tr.invoiceNo)}</b></span></div>
        ${tr.eta&&step<3?`<div class="trk-eta">⚡ ${trkTime(tr.eta)} 도착 예정</div>`:''}
        <ul class="trk-tl">
          ${tr.events.map((e,i)=>`<li class="${i===0?'now':''}"><span class="tm">[${trkTime(e.t)}]</span> ${esc(e.title)} ${e.en?`<span class="en">(${esc(e.en)})</span>`:''}${e.place?`<span class="pl">${esc(e.place)}</span>`:''}</li>`).join('')}
        </ul>
      </div>
      <div class="trk-side">
        ${tr.pending ? `<h3>결제 대기 중</h3>
          <div class="trk-pending">아직 결제가 완료되지 않았어요. 결제가 끝나면 바로 출고 준비를 시작해요.
          <div class="btn-row"><button class="btn primary sm" onclick="go('/pay/${o.orderId}')">결제하기</button></div></div>`
        : `<h3>택배 기사님 한마디</h3>
          <div class="trk-bubble">${esc(tr.courier.message)}${TRK_STK.gem}</div>
          <h3>택배 기사님 정보</h3>
          <div class="trk-info">${TRK_STK.courier.replace('stk st-courier','stk av')}
            <dl><dt>담당</dt><dd>${esc(tr.courier.name)}</dd><dt>연락처</dt><dd>${esc(tr.courier.phone)}</dd><dt>받는 곳</dt><dd>${esc(o.shippingAddress||'-')}</dd></dl></div>`}
        <h3>주문 상품</h3>
        <div class="trk-items">
          ${items.map(it=>`<div class="sumline"><span style="display:flex;align-items:center"><span class="mini">${productImg(it)}</span>${esc(it.name)} × ${it.quantity}</span><span>${won(it.price*it.quantity)}</span></div>`).join('')}
          <div class="btn-row" style="justify-content:flex-end;margin-top:8px"><button class="btn ghost sm" onclick="go('/order/${o.orderId}')">주문 상세 보기</button><button class="btn ghost sm" onclick="render()">↻ 새로고침</button></div>
        </div>
      </div>
    </div>
    <aside class="rail trk-rail" aria-hidden="true"><div class="pola-list">${polas}</div></aside>
  </div>`;
}
function onHeaderSearch(q){
  const s=String(q||'').trim();
  const onTrk=(location.hash||'').startsWith('#/tracking');
  if(/^배송\s*(조회|추적)?$/.test(s)) return go('/tracking');
  if(onTrk && /^#?\d+$/.test(s)) return go('/tracking/'+s.replace('#',''));
  doSearch(s);
}

function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast';
    el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:opacity .2s';
    document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(toastT); toastT=setTimeout(()=>el.style.opacity='0',2000);
}

/* ===================== 시작 ===================== */
async function startApp(){
  if(!CONFIG.USE_MOCK && session.get()){
    try{
      const user = await api.me();
      if(user) session.set({token:'session', user}); else session.clear();
    }catch(e){
      if(e.status===401) session.clear();                 // 서버 세션 만료 → 로그아웃 처리
      else console.warn('로그인 상태 확인 실패:', e.message);
    }
  }
  await render();
}
startApp();
</script>
